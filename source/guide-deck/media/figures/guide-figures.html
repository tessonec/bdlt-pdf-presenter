<script>/* inlined from ../lib/bdlt-icons.js */
/* bdlt-icons.js -- icons for the buttons of widgets, in the line style of BDLT PDF Presenter's
 * own toolbar and of its bar under a frame animation (24 x 24, stroke only, round ends).
 *
 * A button whose effect is obvious carries an icon, not a word: play, pause, one step, back to
 * the start, undo, pen, eraser. A button that needs explaining keeps its word ("Relax", "Shake").
 *
 *   <script src="../lib/bdlt-icons.js"><\/script>          tools/inline-widget.py puts it in the file
 *   <button id="play" data-icon="play" aria-label="Play"></button>     filled in when the page loads
 *   bdltIcon(button, 'pause', 'Pause')                    change it later (play <-> pause)
 *
 * The label is what a screen reader says and what a mouse shows on hover; give one to every
 * icon button. An icon button is 42 px wide and as high as the other buttons, for fingers.
 */
(function () {
  var ICONS = {
    play:   '<path d="M8 5v14l11-7z"/>',
    pause:  '<path d="M8 5v14M16 5v14"/>',
    step:   '<path d="M9 6l6 6-6 6"/>',                                    // one step on, as "next frame"
    back:   '<path d="M15 6l-6 6 6 6"/>',                                  // one step back
    reset:  '<path d="M6 5v14"/><path d="M19 5l-10 7 10 7z"/>',            // back to the start
    undo:   '<path d="M9 6L4 11l5 5"/><path d="M4 11h10a5 5 0 0 1 0 10h-3"/>',
    pen:    '<path d="M4 20l1.2-4.4L15.6 5.2a2 2 0 0 1 2.8 0l.4.4a2 2 0 0 1 0 2.8L8.4 18.8z"/><path d="M13.5 7.3l3.2 3.2"/>',
    eraser: '<path d="M9 20h11"/><path d="M4.6 14.6l9-9a2 2 0 0 1 2.8 0l2 2a2 2 0 0 1 0 2.8L11 18H8z"/>',
    node:   '<circle cx="12" cy="12" r="7.5"/><path d="M12 8.6v6.8M8.6 12h6.8"/>',          // add a node
    link:   '<circle cx="6" cy="17.5" r="3"/><circle cx="18" cy="6.5" r="3"/><path d="M8.3 15.4l7.4-6.8"/>'
  };
  var style = document.createElement('style');
  style.textContent =
    '.bdlt-icon{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}' +
    'button[data-icon]{min-width:42px;padding-left:9px;padding-right:9px;display:inline-grid;place-items:center}' +
    'button[data-icon][hidden]{display:none}';
  document.head.appendChild(style);
  window.bdltIcon = function (button, name, label) {
    if (!ICONS[name]) throw new Error('bdlt-icons: no icon "' + name + '"');
    button.dataset.icon = name;
    button.innerHTML = '<svg class="bdlt-icon" viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + '</svg>';
    if (label) { button.setAttribute('aria-label', label); button.title = label; }
  };
  window.BDLT_ICONS = ICONS;
  function fill() {
    document.querySelectorAll('button[data-icon]').forEach(function (b) {
      if (!b.querySelector('svg')) window.bdltIcon(b, b.dataset.icon, b.getAttribute('aria-label'));
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fill); else fill();
})();

</script>
<style>/* inlined from ../bar/bdlt-bar.css */
/* bdlt-bar.css -- the row under the picture of a widget: buttons, chips, a few words.
   Values that change stand in chips: cells of fixed width at fixed places, white on UZH blue.
   A minimal copy written for the guide deck of BDLT PDF Presenter (the release v3.4.1 has no bar/). */
.bar { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-top: 1px solid var(--bdlt-line); min-height: 34px; white-space: nowrap; }
.chip { display: inline-block; box-sizing: border-box; background: var(--uzh-blue); color: #fff; font-weight: 600; font-size: 18px; line-height: 30px;
        height: 30px; padding: 0 10px; border-radius: 6px; text-align: center; font-variant-numeric: tabular-nums; flex: none; overflow: hidden; }
.note { flex: 1; min-width: 0; height: 30px; line-height: 30px; font-size: 18px; color: #000; overflow: hidden; text-overflow: ellipsis; }
.key { display: inline-flex; align-items: center; gap: 6px; font-size: 17px; color: #000; flex: none; }
.key i { display: inline-block; width: 14px; height: 14px; box-sizing: border-box; flex: none; }
button[hidden] { display: none; }

</style>
<script>/* inlined from ../bar/bdlt-bar.js */
/* bdlt-bar.js -- chips keep the width of their widest content, so nothing next to them moves.
 *   <span class="chip" id="cB" data-max="block 12 / 12"></span>      BDLT.chip('cB', 'block 3 / 12')
 * A minimal copy written for the guide deck of BDLT PDF Presenter (the release v3.4.1 has no bar/). */
(function () {
  var B = window.BDLT = window.BDLT || {};
  function size() {
    document.querySelectorAll('.chip[data-max]').forEach(function (c) {
      var t = c.textContent; c.style.width = ''; c.textContent = c.dataset.max;
      var w = Math.ceil(c.getBoundingClientRect().width) + 1;
      c.textContent = t; c.style.width = w + 'px';
    });
  }
  B.chip = function (id, text) { var c = document.getElementById(id); if (c && c.textContent !== text) c.textContent = text; };
  B.sizeChips = size;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', size); else size();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(size);
})();

</script>
</head>
<body>
<template id="fig-gestures">
<style>
  #wrap { position: absolute; inset: 0; display: flex; flex-direction: column; }
  #main { flex: 1; min-height: 0; display: flex; gap: 18px; padding: 4px 10px 8px; }
  #screen { flex: 1.5; min-width: 0; position: relative; }
  #screen > svg { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: pointer; -webkit-user-select: none; user-select: none; }
  #legend, #rules { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 12px; font-size: 19px; line-height: 1.25; }
  #legend .row, #rules .row { display: flex; align-items: flex-start; gap: 10px; }
  #legend .row i { flex: none; width: 18px; height: 18px; margin-top: 3px; border-radius: 3px; }
  #legend b, #rules b { display: block; }
  #legend .quiet, #rules .quiet { color: var(--bdlt-ink-2); padding-left: 28px; }
  #legend[hidden], #rules[hidden] { display: none; }
  .zone { transition: fill-opacity .55s ease-out; }
  .game .zone { transition: fill-opacity .12s linear; }
  .zone.lit { transition: none; }
  .glow { transition: opacity .7s ease-out; opacity: 0; pointer-events: none; }
  .glow.lit { transition: none; opacity: 1; }
  .zlabel { font-weight: 600; font-size: 17px; pointer-events: none; }
  .znote { font-size: 15px; pointer-events: none; }
  svg text { -webkit-user-select: none; user-select: none; }
</style>
<div id="wrap">
  <div id="main">
    <div id="screen"><svg id="svg" role="img" aria-label="A small screen with the four tap zones"></svg></div>
    <div id="legend">
      <div class="row"><i style="background:var(--uzh-apple)"></i><span><b>Left third</b>one tap: the previous slide</span></div>
      <div class="row"><i style="background:var(--uzh-berry)"></i><span><b>Right third</b>one tap: the next slide</span></div>
      <div class="row"><i style="background:var(--uzh-gold)"></i><span><b>Top centre</b>one tap: the toolbar, on or off</span></div>
      <div class="row"><i style="background:var(--uzh-blue)"></i><span><b>Lower quarter</b>three quick taps: the slide overview</span></div>
      <div class="quiet">The middle does nothing, so a stray touch is harmless.</div>
    </div>
    <div id="rules" hidden>
      <div class="row"><span><b>A memory game</b>Watch the lamps, then tap them in the same order.</span></div>
      <div class="row"><span>Each round adds one lamp. Eight in a row wins.</span></div>
      <div class="row"><span>You have three seconds for each lamp.</span></div>
      <div class="quiet" style="padding-left:0">The button at the left of the bar ends the game.</div>
    </div>
  </div>
  <div class="bar">
    <button id="reset" data-icon="reset" aria-label="Back to the start"></button>
    <span class="chip" id="cP" data-max="round 8 / 8"></span>
    <span class="chip" id="cB" data-max="toolbar off"></span>
    <span class="chip" id="cO" data-max="overview closed"></span>
    <span class="note" id="msg"></span>
  </div>
</div>
</template>
<script type="text/plain" id="code-gestures">
// ---- the small deck and its zones. Positions are shares of the small slide, as in the presenter:
//      right and left third (upper three quarters), top quarter of the middle third, lower quarter.
const N = 5;                                      // slides of the small deck
const W = 640, H = 360, PAD = 14;                 // px of the drawing: the screen and its bezel
const ZONES = [
  { id: 'prev',  x: 0,     y: 0,    w: 1 / 3, h: 0.75, colour: BDLT.hues.apple[0], ink: '#000', label: 'Previous', sub: 'tap' },
  { id: 'next',  x: 2 / 3, y: 0,    w: 1 / 3, h: 0.75, colour: BDLT.hues.berry[0], ink: '#fff', label: 'Next', sub: 'tap' },
  { id: 'bar',   x: 1 / 3, y: 0,    w: 1 / 3, h: 0.25, colour: BDLT.hues.gold[0],  ink: '#000', label: 'Toolbar', sub: 'tap' },
  { id: 'sheet', x: 0,     y: 0.75, w: 1,     h: 0.25, colour: BDLT.hues.blue[0],  ink: '#fff', label: 'Slide overview', sub: 'three quick taps' }
];
const IDLE = 0.18, LIT = 0.92;                    // how strongly a zone is filled at rest and when it lights up
const ALL_LIT = bdlt.params.lit === '1';          // the poster: every lamp on, so that the picture reads alone
const TRIPLE_MS = 450;                            // three taps count as one triple tap within this time, as in the presenter

const svg = d3.select('#svg').attr('viewBox', `0 0 ${W + 2 * PAD} ${H + 2 * PAD}`).attr('preserveAspectRatio', 'xMidYMid meet');
svg.append('rect').attr('width', W + 2 * PAD).attr('height', H + 2 * PAD).attr('rx', 22).attr('fill', '#17181C');          // the bezel
const g = svg.append('g').attr('transform', `translate(${PAD},${PAD})`);
g.append('rect').attr('width', W).attr('height', H).attr('rx', 6).attr('fill', '#fff');                                   // the small slide
const numeral = g.append('text').attr('x', W / 2).attr('y', H * 0.5 + 34).attr('text-anchor', 'middle').attr('font-size', 110).attr('font-weight', 600).attr('fill', '#000');
const caption = g.append('text').attr('x', W / 2).attr('y', H * 0.5 + 62).attr('text-anchor', 'middle').attr('font-size', 17).attr('fill', BDLT.ink2);

// the lamps: a soft halo under each zone (seen only while it lights up), then the zone itself
const defs = svg.append('defs');

tool.append('rect').attr('x', W * 0.3).attr('y', 8).attr('width', W * 0.4).attr('height', 26).attr('rx', 8).attr('fill', '#17181C');

// ---- what a tap does: one function from the state and the place of the tap to the next state.

// ---- hidden: a memory game on the four lamps, after the electronic game of 1978 that the lamps are a
//      nod to. It starts with the taps of a zapateo: right, right, left, right, right. The lamps then play a

  won: 'Eight in a row. Tap a lamp to play again.',
  wrong: 'Wrong lamp. Tap a lamp to start again.', slow: 'Too slow. Tap a lamp to start again.'

// sound: one square wave at a time, only in the copy that is operated (never in the projector's)
let actx = null, osc = null, sounding = null;

document.getElementById('svg').addEventListener('pointerdown', e => {

<script type="text/plain" id="code-alive">
// ---- the run: T blocks are found one after the other. Most extend the longest chain; now and then
//      a second block is found at the height of the tip (a fork). The next block decides which of the
//      two is built on, and the other is orphaned. The whole run is computed once from the seed;
//      step t of the picture is a look-up. An illustration of the longest-chain rule, not a model
//      with real parameters.
const T = 12;                                               // blocks found after the first one
const FORK = 0.22;                                          // chance that a new block competes with the tip
const SEED = parseInt(bdlt.params.seed || '59', 10);        // chosen by eye: three forks, well apart, won by either side
const START = Math.min(T, Math.max(0, parseInt(bdlt.params.start || '0', 10)));
const MS = Math.max(150, parseInt(bdlt.params.ms || '700', 10));        // time per block while it plays

function prng(seed) {                                        // mulberry32: the same numbers in every copy
  let s = seed >>> 0;
  return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

const blocks = [{ i: 0, parent: -1, h: 0, lane: 0 }];        // i: order found; h: height; lane: 0 centre, 1 below
(function run() {
  const rnd = prng(SEED * 7919 + 13);
  for (let i = 1; i <= T; i++) {
    const top = Math.max(...blocks.map(b => b.h)), tips = blocks.filter(b => b.h === top);
    if (tips.length === 1 && top > 0 && rnd() < FORK) {      // a competitor of the tip: same parent, same height, the other lane
      blocks.push({ i, parent: tips[0].parent, h: top, lane: 1 - tips[0].lane });
    } else {                                                 // builds on a tip (on either of two, with equal chance)
      const p = tips[Math.floor(rnd() * tips.length)];
      blocks.push({ i, parent: p.i, h: top + 1, lane: p.lane });
    }
  }
})();
// what the picture shows after t blocks: which blocks are there, and which of them are orphaned
function at(t) {
  const seen = blocks.slice(0, t + 1), top = Math.max(...seen.map(b => b.h));
  const on = new Set();
  seen.filter(b => b.h === top).forEach(b => { for (let c = b; c; c = c.parent < 0 ? null : blocks[c.parent]) on.add(c.i); });
  const tied = seen.filter(b => b.h === top).length > 1;
  return { seen, on, tied, orphans: seen.filter(b => !on.has(b.i)).length, heights: top };

const HEIGHTS = Math.max(...blocks.map(b => b.h));

function paint(sel, t, animate) {
  const svg = d3.select(sel), box = svg.node().getBoundingClientRect(), w = box.width, h = box.height;
  if (!w || !h) return;

  svg.selectAll('line').data(v.seen.filter(b => b.parent >= 0), b => b.i).join('line').attr('class', b => 'link' + (v.on.has(b.i) ? '' : ' off'))
    .attr('x1', b => x(blocks[b.parent])).attr('y1', b => yy(blocks[b.parent])).attr('x2', x).attr('y2', yy);

    enter => enter.append('rect').attr('rx', 3).attr('opacity', animate ? 0 : 1).call(e => animate && e.transition().duration(260).attr('opacity', 1)))
    .attr('class', b => 'blk' + (v.on.has(b.i) ? '' : ' off'))
    .attr('x', b => x(b) - side / 2).attr('y', b => yy(b) - side / 2).attr('width', side).attr('height', side);
  svg.selectAll('line').lower();
}
function words(t) {
  if (t === 0) return 'Press play: the right half builds the chain.';
  const before = at(t - 1), now = at(t);
  if (now.tied && !before.tied) return 'A fork: two blocks at one height.';
  if (before.tied && !now.tied) return 'The longer chain wins; one block is orphaned.';
  return 'A new block extends the chain.';
}
function draw(s) {
  paint('#a', T, false);                                     // the still half: always the finished picture
  paint('#b', s.t, true);
  const v = at(s.t);
  BDLT.chip('cT', 'block ' + s.t + ' / ' + T);
  BDLT.chip('cO', 'orphaned ' + v.orphans);
  document.getElementById('msg').textContent = words(s.t);
}

// ---- state: {t, running}. Only the lecturer's (or the single) copy changes it.
const playB = document.getElementById('play');
let timer = null;
const S = () => bdlt.state;
playB.onclick = () => { const s = S(); bdlt.setState(s.running ? { ...s, running: false } : { t: s.t >= T ? 0 : s.t, running: true }); };
document.getElementById('stepb').onclick = () => bdlt.setState({ t: Math.min(T, S().t + 1), running: false });
document.getElementById('reset').onclick = () => bdlt.setState({ t: 0, running: false });
bdlt.onState(s => {
  draw(s);
  if (playB.dataset.icon !== (s.running ? 'pause' : 'play') || !playB.firstChild) bdltIcon(playB, s.running ? 'pause' : 'play', s.running ? 'Pause' : 'Play');
  const driver = bdlt.role !== 'projector';                  // the clock runs only in the copy that may change the state
  if (driver && s.running && !timer) timer = setInterval(tick, MS);
  if ((!s.running || !driver) && timer) { clearInterval(timer); timer = null; }
});
function tick() { const s = S(); bdlt.setState(s.t >= T - 1 ? { t: T, running: false } : { t: s.t + 1, running: true }); }
bdlt.onHide(() => { if (bdlt.role !== 'projector' && S() && S().running) bdlt.setState({ ...S(), running: false }); });
if ('ResizeObserver' in window) new ResizeObserver(() => S() && draw(S())).observe(document.getElementById('wrap'));
BDLT.whenFonts(() => { BDLT.sizeChips(); if (S()) draw(S()); });

bdlt.setState(bdlt.state || { t: START, running: false });
</script>
