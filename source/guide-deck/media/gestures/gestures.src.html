<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The four tap zones of BDLT PDF Presenter, to try</title>
<!-- The page of a slide with the four tap zones of BDLT PDF Presenter drawn on it, as on the
     slides before it in the guide deck: each zone has a hand and its words, has a colour, and
     lights up when it is tapped, like the lamps of the Simon game (1978). No device frame, no bar
     below: what the taps did stands in three chips in the middle of the page.
     The house style with Source Sans cut down (../style), D3's selections and transitions.
     Built by ./build.sh into gestures.html, one file with everything inside. -->
<link rel="stylesheet" href="../style/bdlt-style-latin.css">
<script src="../../bdltplots/web/bdlt-style.js"></script>
<!-- D3, only the modules these figures use (selections and transitions): 51 kB in place of 280 kB -->
<script src="https://cdn.jsdelivr.net/npm/d3-color@3.1.0/dist/d3-color.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-dispatch@3.0.1/dist/d3-dispatch.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-ease@3.0.1/dist/d3-ease.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-interpolate@3.0.1/dist/d3-interpolate.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-selection@3.0.0/dist/d3-selection.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-timer@3.0.1/dist/d3-timer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-transition@3.0.1/dist/d3-transition.min.js"></script>
<script src="../lib/bdlt-icons.js"></script>
<link rel="stylesheet" href="../bar/bdlt-bar.css">
<script src="../bar/bdlt-bar.js"></script>
<style>
  #wrap { position: absolute; inset: 0; }
  #svg { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: pointer; -webkit-user-select: none; user-select: none; }
  .zone { transition: fill-opacity .55s ease-out; }
  .game .zone { transition: fill-opacity .12s linear; }
  .zone.lit { transition: none; }
  .glow { transition: opacity .7s ease-out; opacity: 0; pointer-events: none; }
  .glow.lit { transition: none; opacity: 1; }
  svg text { pointer-events: none; -webkit-user-select: none; user-select: none; }
  .head { font-weight: 600; font-size: 35px; }
  .sub { font-size: 25px; }
  .times { font-weight: 600; font-size: 37.5px; }
  .chip text { font-weight: 600; font-size: 18px; fill: #fff; font-variant-numeric: tabular-nums; }
  #msg { font-size: 18px; fill: #000; }
  #hint { font-size: 15px; fill: var(--bdlt-ink-2); }
</style>
</head>
<body>
<div id="wrap"><svg id="svg" role="img" aria-label="This page with its four tap zones"></svg></div>
<script>
/* BEGIN bdlt-stub (copied from widgets/lib/bdlt-stub.js by tools/inline-widget.py) */
/* END bdlt-stub */

// ---- the page and its zones, at the places and sizes of the slides before this one in the guide
//      deck (deck.tex: \guideslidepanel, \guidezonetall, \guidezonewide; 1 cm there is 35.445 px here):
//      right and left third (upper three quarters), top quarter of the middle third, lower quarter.
const N = 5;                                      // slides of the deck the taps are counted on
const W = 1147, H = 507;                          // px of the drawing: the page
// the hand of the gesture slides (Tabler Icons "hand-click", MIT; the same path data as make-icons.py)
const HAND = ['M8 13v-8.5a1.5 1.5 0 0 1 3 0v7.5', 'M11 11.5v-2a1.5 1.5 0 0 1 3 0v2.5', 'M14 10.5a1.5 1.5 0 0 1 3 0v1.5',
  'M17 11.5a1.5 1.5 0 0 1 3 0v4.5a6 6 0 0 1 -6 6h-2h.208a6 6 0 0 1 -5.012 -2.7l-.196 -.3c-.312 -.479 -1.407 -2.388 -3.286 -5.728a1.5 1.5 0 0 1 .536 -2.022a1.867 1.867 0 0 1 2.28 .28l1.47 1.47',
  'M5 3l-1 -1', 'M4 7h-1', 'M14 3l1 -1', 'M15 6h1'];
const ZONES = [
  { id: 'prev',  x: 0,     y: 0,    w: 1 / 3, h: 0.75, colour: BDLT.hues.apple[0], ink: '#000', head: 'Tap here', sub: 'Previous slide' },
  { id: 'next',  x: 2 / 3, y: 0,    w: 1 / 3, h: 0.75, colour: BDLT.hues.berry[0], ink: '#fff', head: 'Tap here', sub: 'Next slide' },
  { id: 'bar',   x: 1 / 3, y: 0,    w: 1 / 3, h: 0.25, colour: BDLT.hues.gold[0],  ink: '#000', head: 'Tap here', sub: 'Toolbar on or off' },
  { id: 'sheet', x: 0,     y: 0.75, w: 1,     h: 0.25, colour: BDLT.hues.blue[0],  ink: '#fff', head: 'Triple-tap here', sub: 'Opens the strip of slides; tap one to jump to it' }
];
const IDLE = 0.18, LIT = 0.92;                    // how strongly a zone is filled at rest and when it lights up
const ALL_LIT = bdlt.params.lit === '1';          // the poster: every lamp on, so that the picture reads alone
const TRIPLE_MS = 450;                            // three taps count as one triple tap within this time, as in the presenter

const svg = d3.select('#svg').attr('viewBox', `0 0 ${W} ${H}`).attr('preserveAspectRatio', 'xMidYMid meet');
const g = svg.append('g');
g.append('rect').attr('width', W).attr('height', H).attr('fill', '#E8EBF3');                                             // the page

// the lamps: a soft halo under each zone (seen only while it lights up), then the zone itself
const defs = svg.append('defs');
defs.append('filter').attr('id', 'halo').attr('x', '-30%').attr('y', '-30%').attr('width', '160%').attr('height', '160%')
  .append('feGaussianBlur').attr('stdDeviation', 9);
const glows = g.append('g').selectAll('rect').data(ALL_LIT ? [] : ZONES).join('rect').attr('class', 'glow')
  .attr('x', d => d.x * W).attr('y', d => d.y * H).attr('width', d => d.w * W).attr('height', d => d.h * H)
  .attr('fill', d => d.colour).attr('filter', 'url(#halo)');
const zones = g.append('g').selectAll('g').data(ZONES).join('g');
zones.append('rect').attr('class', 'zone').attr('x', d => d.x * W).attr('y', d => d.y * H).attr('width', d => d.w * W).attr('height', d => d.h * H)
  .attr('fill', d => d.colour).attr('fill-opacity', ALL_LIT ? LIT : IDLE);
// in each zone: the hand and the words. Tall zones have the hand above the words, wide ones to their left.
const labels = zones.append('g').attr('class', 'label');
const tall = d => d.h > 0.5, X0 = d => d.x * W, Y0 = d => d.y * H;
const handAt = d => (tall(d) ? [X0(d) + d.w * W / 2 - 87.9, 56.7, 7.325] : [d.id === 'sheet' ? 0.22 * W : X0(d) + 29.42, Y0(d) + 17.72, 3.81]);
const hands = labels.append('g').attr('class', 'hand').attr('transform', d => { const q = handAt(d); return `translate(${q[0]},${q[1]}) scale(${q[2]})`; })
  .attr('fill', 'none').attr('stroke-width', 1.5).attr('stroke-linecap', 'round').attr('stroke-linejoin', 'round');
HAND.forEach(p => hands.append('path').attr('d', p));
const wordsX = d => (tall(d) ? X0(d) + d.w * W / 2 : d.id === 'sheet' ? 440.5 : X0(d) + 150.3);
labels.append('text').attr('class', 'head').attr('text-anchor', d => (tall(d) ? 'middle' : 'start')).attr('x', wordsX).attr('y', d => (tall(d) ? 285.4 : Y0(d) + (d.id === 'sheet' ? 52.5 : 54.3))).text(d => d.head);
labels.append('text').attr('class', 'sub').attr('text-anchor', d => (tall(d) ? 'middle' : 'start')).attr('x', wordsX).attr('y', d => (tall(d) ? 329.6 : Y0(d) + (d.id === 'sheet' ? 94.9 : 96.8))).text(d => d.sub);
// "x 3" next to the hand of the lower quarter; the cross is drawn, so that it looks the same in the poster
const times = labels.filter(d => d.id === 'sheet');
times.append('path').attr('class', 'hand').attr('fill', 'none').attr('stroke-width', 3.2).attr('d', 'M350.9 407.3l15.2 15.2M366.1 407.3l-15.2 15.2');
times.append('text').attr('class', 'times').attr('x', 372.2).attr('y', 424.3).text('3');
const ink = (d, lit) => (lit ? d.ink : '#000');
function inkOf(sel, lit) { sel.selectAll('text').attr('fill', d => ink(d, lit)); sel.selectAll('.hand').attr('stroke', d => ink(d, lit)); }
inkOf(zones, ALL_LIT);
// thin lines between the zones, as on the slides before
g.append('g').attr('stroke', '#C9CEDC').attr('stroke-width', 1.25).attr('pointer-events', 'none').selectAll('line')
  .data([[W / 3, 0, W / 3, 0.75 * H], [2 * W / 3, 0, 2 * W / 3, 0.75 * H], [0, 0.75 * H, W, 0.75 * H], [W / 3, 0.25 * H, 2 * W / 3, 0.25 * H]])
  .join('line').attr('x1', d => d[0]).attr('y1', d => d[1]).attr('x2', d => d[2]).attr('y2', d => d[3]);

// the middle of the page does nothing, so what the taps did stands there: three chips of fixed width and a few words
const mid = g.append('g').attr('pointer-events', 'none');
const CHIP_W = 170, CHIP_H = 30, CHIP_Y = 0.25 * H + 34;
const chipText = ['cP', 'cB', 'cO'].map((id, i) => {
  const c = mid.append('g').attr('class', 'chip').attr('id', id).attr('transform', `translate(${W / 2 - CHIP_W / 2},${CHIP_Y + i * (CHIP_H + 8)})`);
  c.append('rect').attr('width', CHIP_W).attr('height', CHIP_H).attr('rx', 6).attr('fill', BDLT.hues.blue[0]);
  return c.append('text').attr('x', CHIP_W / 2).attr('y', 21.4).attr('text-anchor', 'middle');
});
const chip = (i, t) => { if (chipText[i].text() !== t) chipText[i].text(t); };
const msg = mid.append('text').attr('id', 'msg').attr('x', W / 2).attr('y', CHIP_Y + 3 * (CHIP_H + 8) + 28).attr('text-anchor', 'middle');
const hint = mid.append('text').attr('id', 'hint').attr('x', W / 2).attr('y', CHIP_Y + 3 * (CHIP_H + 8) + 54).attr('text-anchor', 'middle');

// ---- what a tap does: one function from the state and the place of the tap to the next state.
//      p: slide, bar: toolbar shown, sheet: overview open, taps: taps counted in the lower quarter,
//      hit: the zone that lights up, k: a counter of taps (a new k lights the lamp in every copy), msg: what to say.
function zoneAt(fx, fy) {
  if (fy > 0.75) return 'sheet';
  if (fx < 1 / 3) return 'prev';
  if (fx > 2 / 3) return 'next';
  return fy < 0.25 ? 'bar' : null;
}
function tapped(s, fx, fy) {
  const n = { ...s, k: s.k + 1, hit: null, taps: 0 };
  if (s.sheet) return { ...n, sheet: false, msg: 'close' };          // overview open: the next tap closes it
  const z = zoneAt(fx, fy);
  if (z === 'next') return { ...n, hit: z, p: Math.min(N, s.p + 1), msg: s.p < N ? 'next' : 'last' };
  if (z === 'prev') return { ...n, hit: z, p: Math.max(1, s.p - 1), msg: s.p > 1 ? 'prev' : 'first' };
  if (z === 'bar') return { ...n, hit: z, bar: !s.bar, msg: s.bar ? 'baroff' : 'baron' };
  if (z === 'sheet') {
    if (s.taps >= 2) return { ...n, hit: z, sheet: true, msg: 'sheet' };
    return { ...n, hit: z, taps: s.taps + 1, msg: s.taps ? 'tap2' : 'tap1' };
  }
  return { ...n, msg: 'middle' };
}
const WORDS = {
  start: 'Tap a zone.',
  next: 'Right third: the next slide.', last: 'Right third: this is the last slide.',
  prev: 'Left third: the previous slide.', first: 'Left third: this is the first slide.',
  baron: 'Top centre: the toolbar shows.', baroff: 'Top centre: the toolbar hides.',
  tap1: 'Lower quarter: two more quick taps.', tap2: 'Lower quarter: one more quick tap.',
  slow: 'The overview needs three quick taps.', sheet: 'Three taps: the slide overview opens.',
  close: 'The next tap closes the overview.',
  middle: 'The middle does nothing.'
};

// ---- hidden: a memory game on the four lamps, after the electronic game of 1978 that the lamps are a
//      nod to. It starts with the taps of a zapateo: right, right, left, right, right. The lamps then play a
//      growing sequence, each with its tone, and the player repeats it; eight in a row win.
//      Tones (square waves), times and the signals for winning and losing are those measured on the
//      original game (waitingforfriday.com, "Reverse engineering an MB Electronic Simon game"):
//      green 415 Hz, red 310 Hz, yellow 252 Hz, blue 209 Hz; 0.42 s per lamp up to five lamps and
//      0.32 s from six on, 0.05 s between them; three seconds to answer; losing: 42 Hz for 1.5 s;
//      winning: six short beeps of the last lamp.
const SECRET = ['next', 'next', 'prev', 'next', 'next'];
const TONE = { prev: 415, next: 310, bar: 252, sheet: 209 };            // Hz
const WIN_AT = 8, ANSWER_MS = 3000, LOSE_HZ = 42, LOSE_MS = 1500, GAP_MS = 50, PRESS_MS = 260;
const lampMs = n => (n <= 5 ? 420 : 320);
const SOUND = bdlt.params.sound !== '0';
const GAME_WORDS = {
  show: 'Zapateo! Watch the lamps.', input: 'Your turn: repeat them.',
  won: 'Eight in a row. Tap a lamp to play again.',
  wrong: 'Wrong lamp. Tap a lamp to start again.', slow: 'Too slow. Tap a lamp to start again.'
};

// sound: one square wave at a time, only in the copy that is operated (never in the projector's)
let actx = null, osc = null, sounding = null;
function audio() {
  if (!SOUND || bdlt.role === 'projector') return null;
  if (!actx) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; try { actx = new A(); } catch (e) { return null; } }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(hz) {
  if (osc) { try { osc.stop(); } catch (e) {} osc.disconnect(); osc = null; }
  const a = hz ? audio() : null; if (!a) return;
  const gain = a.createGain(); gain.gain.value = 0.07;
  osc = a.createOscillator(); osc.type = 'square'; osc.frequency.value = hz; osc.connect(gain); gain.connect(a.destination); osc.start();
}
// browsers let a page sound only after a touch has ended: the context is made then
['pointerup', 'click', 'touchend'].forEach(t => addEventListener(t, () => { if (S() && S().g) audio(); }, true));

let shownK = null, shownGame = null;
function draw(s) {
  const game = !!s.g;
  if (game !== shownGame) {                        // in the game the zones are four lamps: the hands and words go
    svg.classed('game', game); labels.attr('display', game ? 'none' : null); shownGame = game;
  }
  if (game) {
    const q = s.g, why = q.ph === 'lost' ? q.why : q.ph;
    zones.select('rect').classed('lit', false).attr('fill-opacity', d => (d.id === q.on ? 1 : 0.3));
    glows.classed('lit', d => d.id === q.on);
    chip(0, 'round ' + q.n + ' / ' + WIN_AT);
    chip(1, q.ph === 'show' ? 'watch' : q.ph === 'input' ? 'your turn' : q.ph === 'won' ? 'well done' : 'try again');
    chip(2, 'best ' + (s.best || 0));
    msg.text(GAME_WORDS[why] || ''); hint.text('Tap the middle to end the game.');
    const want = q.bz ? 'lose' : q.on;               // what should sound now
    if (want !== sounding) { sounding = want; tone(want === 'lose' ? LOSE_HZ : TONE[want] || 0); }
    shownK = s.k; return;
  }
  if (sounding) { sounding = null; tone(0); }
  chip(0, 'slide ' + s.p + ' / ' + N);
  chip(1, s.bar ? 'toolbar on' : 'toolbar off');
  chip(2, s.sheet ? 'overview open' : 'overview closed');
  msg.text(WORDS[s.msg] || ''); hint.text('');
  zones.select('rect').filter(d => !(shownK !== null && s.k !== shownK && d.id === s.hit)).attr('fill-opacity', ALL_LIT ? LIT : IDLE);
  // the lamp: lights at once when k is new, then fades (the transition is in the style sheet)
  if (!ALL_LIT && shownK !== null && s.k !== shownK && s.hit) {
    const on = d => d.id === s.hit;
    zones.select('rect').filter(on).classed('lit', true).attr('fill-opacity', LIT);
    inkOf(zones.filter(on), true);
    glows.filter(on).classed('lit', true);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      zones.select('rect').filter(on).classed('lit', false).attr('fill-opacity', IDLE);
      glows.filter(on).classed('lit', false);
      setTimeout(() => { if (shownK === s.k) inkOf(zones.filter(on), false); }, 260);
    }));
  }
  shownK = s.k;
}

// ---- state: {p, bar, sheet, taps, hit, k, msg}, and in the game g: {seq, n, ph, i, on, bz, why} and best.
//      Only the lecturer's (or the single) copy changes it.
const S = () => bdlt.state;
const first = () => ({ p: Math.min(N, Math.max(1, parseInt(bdlt.params.p || '1', 10))), bar: bdlt.params.bar === '1', sheet: bdlt.params.sheet === '1',
                       taps: 0, hit: null, k: 0, msg: 'start' });
// the game is run by the clock of the copy that is operated; a new "run" number stops the timers of an earlier game
let run = 0, answerTimer = null, recent = [];
const later = (ms, f) => { const r = run; setTimeout(() => { if (r === run && S() && S().g) f(); }, ms); };
const setG = (q, more) => bdlt.setState({ ...S(), ...more, k: S().k + 1, g: q });
function startGame() {
  run++; clearTimeout(answerTimer);
  const seq = Array.from({ length: WIN_AT }, () => ZONES[Math.floor(Math.random() * ZONES.length)].id);     // drawn once, kept in the state
  setG({ seq, n: 1, ph: 'show', i: 0, on: null, bz: false, why: '' }, { hit: null, taps: 0, bar: false, sheet: false });
  later(900, () => showLamp(0));
}
function showLamp(j) {
  setG({ ...S().g, ph: 'show', i: j, on: S().g.seq[j] });
  later(lampMs(S().g.n), () => {
    setG({ ...S().g, on: null });
    later(GAP_MS, () => { if (j + 1 < S().g.n) showLamp(j + 1); else { setG({ ...S().g, ph: 'input', i: 0 }); arm(); } });
  });
}
function arm() { clearTimeout(answerTimer); const r = run; answerTimer = setTimeout(() => { if (r === run && S().g && S().g.ph === 'input') lose('slow'); }, ANSWER_MS); }
function lose(why) {
  clearTimeout(answerTimer); run++;
  setG({ ...S().g, ph: 'lost', on: null, bz: true, why });
  later(LOSE_MS, () => setG({ ...S().g, bz: false }));
}
function win() {                                    // six short beeps of the last lamp: 0.02 s, then five of 0.07 s, 0.02 s apart
  const q = S().g, last = q.seq[q.n - 1]; let t = 300;
  [20, 70, 70, 70, 70, 70].forEach(ms => { later(t, () => setG({ ...S().g, on: last })); later(t + ms, () => setG({ ...S().g, on: null })); t += ms + 20; });
  later(t + 100, () => setG({ ...S().g, ph: 'won' }));
}
function press(id) {                                // a tap on a pad during the game
  const q = S().g;
  if (q.ph === 'won' || (q.ph === 'lost' && !q.bz)) return startGame();
  if (q.ph !== 'input' || !id) return;
  if (id !== q.seq[q.i]) return lose('wrong');
  clearTimeout(answerTimer);
  const i = q.i + 1, done = i === q.n;
  setG({ ...q, i, on: id, ph: done ? 'show' : 'input' }, { best: Math.max(S().best || 0, done ? q.n : 0) });
  later(PRESS_MS, () => {
    setG({ ...S().g, on: null });
    if (!done) return arm();
    if (q.n === WIN_AT) return win();
    later(800, () => { setG({ ...S().g, n: q.n + 1 }); showLamp(0); });
  });
}
let tripleTimer = null;
const leave = () => { run++; clearTimeout(answerTimer); recent = []; };
const endGame = () => { leave(); bdlt.setState({ ...first(), p: 1, bar: false, sheet: false, k: S().k + 1, best: S().best || 0 }); };
document.getElementById('svg').addEventListener('pointerdown', e => {
  if (bdlt.role === 'projector' || (e.pointerType === 'mouse' && e.button !== 0)) return;
  e.preventDefault();
  const r = g.select('rect').node().getBoundingClientRect();
  const fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
  if (fx < 0 || fx > 1 || fy < 0 || fy > 1) return;
  if (S().g) { const z = zoneAt(fx, fy); return z ? press(z) : endGame(); }      // in the game the zones are the lamps; the middle ends it
  const next = tapped(S(), fx, fy);
  recent = recent.concat(next.hit || '-').slice(-SECRET.length);
  if (recent.join() === SECRET.join()) { recent = []; return startGame(); }
  bdlt.setState(next);
});
bdlt.onState(s => {
  draw(s);
  // taps in the lower quarter that do not become three in time are forgotten (the clock runs in one copy only)
  clearTimeout(tripleTimer); tripleTimer = null;
  if (bdlt.role !== 'projector' && !s.g && s.taps > 0)
    tripleTimer = setTimeout(() => { const c = S(); if (c.taps > 0 && !c.g) bdlt.setState({ ...c, taps: 0, hit: null, msg: 'slow' }); }, TRIPLE_MS);
});
// when the slide is left, a game ends: the zones are back on return
bdlt.onHide(() => { clearTimeout(tripleTimer); tripleTimer = null; tone(0); sounding = null;
  if (bdlt.role !== 'projector' && S() && S().g) { leave(); bdlt.setState({ ...first(), k: S().k + 1, best: S().best || 0 }); } });
if ('ResizeObserver' in window) new ResizeObserver(() => S() && draw(S())).observe(document.getElementById('wrap'));
BDLT.whenFonts(() => { if (S()) draw(S()); });

bdlt.setState(bdlt.state || first());
</script>
</body>
</html>
