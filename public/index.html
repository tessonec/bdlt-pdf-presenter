<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BDLT Presenter">
<meta name="application-name" content="BDLT PDF Presenter">
<meta name="theme-color" content="#08090b">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" href="icon.png">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>BDLT PDF Presenter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a black projection stage with the slide centred; the chrome floats above it and disappears on demand. */
:root{
  color-scheme: dark;
  --stage:#08090b;
  --chrome:rgba(23,24,28,.9);
  --chrome-2:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.11);
  --fg:#eef0f3;
  --muted:#9aa1ad;
  --accent:#FFC845;
  --accent-ink:#1b1305;
  --ui:"IBM Plex Sans", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --num:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
html,body{height:100%}
body{background:var(--stage);color:var(--fg);font-family:var(--ui);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;touch-action:none;overflow:hidden;background:var(--stage)}
#page{position:absolute;transform-origin:0 0;will-change:transform;background:#fff}
#page.anim{transition:transform .22s cubic-bezier(.2,.7,.2,1)}
#page canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;padding:0}
.bar{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);
  display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 0;padding:6px;
  background:var(--chrome);border:1px solid var(--line);border-radius:14px;
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  width:max-content;max-width:calc(100vw - 24px);z-index:10;transition:opacity .2s, transform .2s}
.bar.hidden{opacity:0;pointer-events:none;transform:translate(-50%,-14px)}
.grp{display:flex;align-items:center;gap:2px;padding:0 5px;border-left:1px solid var(--line)}
.grp:first-child{border-left:0}
.grp[hidden]{display:none!important}
.tb{height:40px;min-width:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;color:var(--fg)}
.tb:hover{background:var(--chrome-2)}
.tb:focus-visible,.sw:focus-visible,.btn:focus-visible,.thumb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tb[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb .lbl{font-size:14px;font-weight:500}
#counter{font-family:var(--num);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:68px;text-align:center}
.sw{width:28px;height:28px;border-radius:50%;margin:0 3px;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 2px var(--stage)}

.hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);width:120px;height:5px;margin-left:-60px;
  border-radius:3px;background:rgba(255,255,255,.24);pointer-events:none;transition:opacity .2s;z-index:5}
.bar.hidden ~ .hint{opacity:0}

#sheet{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--chrome);border-top:1px solid var(--line);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  padding-block:8px calc(env(safe-area-inset-bottom,0px) + 14px);
  transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.7,.2,1);touch-action:pan-x}
#sheet.open{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
#strip{display:flex;gap:14px;overflow-x:auto;padding:4px 16px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#strip::-webkit-scrollbar{display:none}
.thumb{flex:none;position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;scroll-snap-align:center;border-radius:6px}
.thumb canvas{height:112px;width:auto;max-width:none;background:#2a2c31;border-radius:4px;outline:2px solid transparent;outline-offset:3px}
.thumb.cur canvas{outline-color:var(--accent)}
.thumb .num{font-family:var(--num);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.thumb.cur .num{color:var(--fg)}
.thumb .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--accent);display:none}
.thumb.has-ink .dot{display:block}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);transform:translate(-50%,16px);
  background:var(--chrome);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;line-height:1.4;
  opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;width:max-content;max-width:min(520px,calc(100vw - 32px));text-align:center;z-index:20}
#toast.show{opacity:1;transform:translate(-50%,0)}

.panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;width:min(440px,calc(100vw - 32px));
  background:var(--chrome);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:14px;
  -webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.panel h2{margin:0;font-size:17px;font-weight:600}
.panel p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{height:40px;padding:0 14px;border-radius:10px;background:var(--chrome-2);border:1px solid var(--line);font-size:14px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}

#dropzone{position:fixed;inset:12px;border:2px dashed var(--accent);border-radius:18px;display:grid;place-items:center;
  font-size:18px;color:var(--fg);background:rgba(8,9,11,.7);z-index:40;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="stage" aria-label="Slide">
  <div id="page"><canvas id="pdfc"></canvas><canvas id="inkc"></canvas><canvas id="livec"></canvas></div>
</div>

<header id="bar" class="bar" role="toolbar" aria-label="BDLT PDF Presenter controls">
  <div class="grp">
    <button class="tb" id="bOpen" title="Open a PDF"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="lbl">Open</span></button>
  </div>
  <div class="grp">
    <button class="tb" id="bPrev" aria-label="Previous slide" title="Previous slide"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span id="counter" aria-live="polite">– / –</span>
    <button class="tb" id="bNext" aria-label="Next slide" title="Next slide"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="tb" id="bGrid" aria-label="Slide overview" title="Slide overview"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="8" height="6" rx="1"/><rect x="13" y="5" width="8" height="6" rx="1"/><rect x="3" y="13" width="8" height="6" rx="1"/><rect x="13" y="13" width="8" height="6" rx="1"/></svg></button>
  </div>
  <div class="grp" id="tools">
    <button class="tb" data-tool="pen" aria-pressed="true" aria-label="Pen" title="Pen"><svg viewBox="0 0 24 24"><path d="M4 20l1.2-4.4L15.6 5.2a2 2 0 0 1 2.8 0l.4.4a2 2 0 0 1 0 2.8L8.4 18.8z"/><path d="M13.5 7.3l3.2 3.2"/></svg></button>
    <button class="tb" data-tool="highlighter" aria-pressed="false" aria-label="Highlighter" title="Highlighter"><svg viewBox="0 0 24 24"><path d="M9 14l-4 4v2h5l2-2"/><path d="M9 14l7-9 4 3-7 9z"/><path d="M4 21h16"/></svg></button>
    <button class="tb" data-tool="laser" aria-pressed="false" aria-label="Laser pointer" title="Laser pointer (leaves no marks)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg></button>
    <button class="tb" data-tool="eraser" aria-pressed="false" aria-label="Eraser" title="Eraser"><svg viewBox="0 0 24 24"><path d="M9 20h11"/><path d="M4.6 14.6l9-9a2 2 0 0 1 2.8 0l2 2a2 2 0 0 1 0 2.8L11 18H8z"/></svg></button>
  </div>
  <div class="grp" id="swatches"></div>
  <div class="grp">
    <button class="tb" id="bUndo" aria-label="Undo" title="Undo on this slide"><svg viewBox="0 0 24 24"><path d="M9 6L4 11l5 5"/><path d="M4 11h10a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="tb" id="bClear" aria-label="Clear ink on this slide" title="Clear ink on this slide"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
  </div>
  <div class="grp">
    <button class="tb" id="bSave" title="Save a PDF with your ink"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span class="lbl">Save</span></button>
    <button class="tb" id="bFs" aria-label="Full screen" title="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="tb" id="bHide" aria-label="Hide toolbar" title="Hide toolbar (tap the top centre of the slide to bring it back)"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
  </div>
</header>
<div class="hint" aria-hidden="true"></div>

<section id="sheet" aria-label="Slide overview"><div class="grab" id="grab"></div><div id="strip"></div></section>

<div id="savePanel" class="panel" role="dialog" aria-modal="true" aria-labelledby="saveTitle" hidden>
  <h2 id="saveTitle">Your annotated PDF is ready</h2>
  <p id="saveMsg"></p>
  <div class="row">
    <button class="btn" id="bSaveClose">Close</button>
    <button class="btn" id="bDl">Download</button>
    <button class="btn pri" id="bShare">Save to Files…</button>
  </div>
</div>

<div id="toast" role="status"></div>
<div id="dropzone" hidden>Drop a PDF to open it</div>
<input type="file" id="file" accept="application/pdf,.pdf" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const stage = $('#stage'), pageEl = $('#page'), pdfc = $('#pdfc'), inkc = $('#inkc'), livec = $('#livec');
const bar = $('#bar'), sheet = $('#sheet'), strip = $('#strip'), counter = $('#counter'), fileIn = $('#file');
const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ---------- state ----------
let pdfDoc = null, pdfBytes = null, fileName = 'slides.pdf', numPages = 0, pageNum = 1, curVp = null;
let ink = new Map(), hist = new Map();
let tool = 'pen';
// UZH CI colours
const colors = { pen: '#0028A5', highlighter: '#FFC845' };
const PALETTE = {
  pen: ['#0028A5', '#FC4C02', '#FFC845', '#A4D233', '#000000', '#FFFFFF'],
  highlighter: ['#FFC845', '#A4D233', '#4AC9E3', '#FC4C02', '#BF0D3E']
};
const COLOR_NAMES = { '#0028A5': 'UZH blue', '#FC4C02': 'UZH orange', '#FFC845': 'UZH gold', '#A4D233': 'UZH apple green', '#000000': 'Black', '#FFFFFF': 'White', '#4AC9E3': 'UZH cyan', '#BF0D3E': 'UZH berry' };
const WIDTH = { pen: 2.6, highlighter: 16 };
let view = { s: 1, tx: 0, ty: 0 };
const base = { w: 0, h: 0, left: 0, top: 0, fit: 1 };
let renderedPS = 0, inkPS = 1, renderToken = 0;
const vps = new Map(), cache = new Map();
const dpr = () => Math.min(window.devicePixelRatio || 1, 3);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- toast ----------
let toastT = 0;
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms); }

// ---------- geometry ----------
function fitFor(vp) { return Math.min(stage.clientWidth / vp.width, stage.clientHeight / vp.height); }
function psFor(vp, zoom) {
  let ps = fitFor(vp) * dpr() * Math.min(zoom, 4);
  const max = 14e6, area = vp.width * vp.height * ps * ps;
  if (area > max) ps *= Math.sqrt(max / area);
  return ps;
}
async function getVp(n) { if (!vps.has(n)) { const p = await pdfDoc.getPage(n); vps.set(n, p.getViewport({ scale: 1 })); } return vps.get(n); }
function layout() {
  const W = stage.clientWidth, H = stage.clientHeight;
  base.fit = fitFor(curVp); base.w = curVp.width * base.fit; base.h = curVp.height * base.fit;
  base.left = (W - base.w) / 2; base.top = (H - base.h) / 2;
  Object.assign(pageEl.style, { width: base.w + 'px', height: base.h + 'px', left: base.left + 'px', top: base.top + 'px' });
}
function applyView() { pageEl.style.transform = `translate(${view.tx}px,${view.ty}px) scale(${view.s})`; }
function clampView() {
  const W = stage.clientWidth, H = stage.clientHeight, S = base.w * view.s, T = base.h * view.s;
  view.tx = S <= W ? (W - S) / 2 - base.left : clamp(view.tx, W - base.left - S, -base.left);
  view.ty = T <= H ? (H - T) / 2 - base.top : clamp(view.ty, H - base.top - T, -base.top);
}
function animateTo(s, tx, ty) {
  pageEl.classList.add('anim'); view = { s, tx, ty }; applyView();
  setTimeout(() => pageEl.classList.remove('anim'), 240); scheduleHiRes();
}

// ---------- rendering ----------
async function renderToCanvas(n, ps) {
  const page = await pdfDoc.getPage(n);
  const vp = page.getViewport({ scale: ps });
  const c = document.createElement('canvas'); c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
  const ctx = c.getContext('2d', { alpha: false }); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  return c;
}
function blit(canvas, ps) {
  pdfc.width = canvas.width; pdfc.height = canvas.height; pdfc.getContext('2d').drawImage(canvas, 0, 0); renderedPS = ps;
  for (const c of [inkc, livec]) { c.width = canvas.width; c.height = canvas.height; }
  inkPS = ps; redrawInk();
}
async function showPage(n) {
  if (!pdfDoc) return;
  n = clamp(n, 1, numPages);
  const my = ++renderToken; pageNum = n; updateCounter(); markThumbs();
  const vp = await getVp(n); if (my !== renderToken) return;
  const ps = psFor(vp, 1);
  let c = cache.get(n);
  if (!c || c.ps < ps * 0.99) { c = { canvas: await renderToCanvas(n, ps), ps }; cache.set(n, c); }
  if (my !== renderToken) return;
  curVp = vp; view = { s: 1, tx: 0, ty: 0 }; layout(); applyView(); blit(c.canvas, ps);
  prefetch(n);
}
async function prefetch(n) {
  for (const k of [n + 1, n - 1, n + 2]) {
    if (k < 1 || k > numPages || n !== pageNum) continue;
    try {
      const vp = await getVp(k), ps = psFor(vp, 1), c = cache.get(k);
      if (c && c.ps >= ps * 0.99) continue;
      cache.set(k, { canvas: await renderToCanvas(k, ps), ps });
    } catch (e) {}
  }
  for (const k of [...cache.keys()]) if (Math.abs(k - pageNum) > 3) cache.delete(k);
}
let hiTimer = 0;
function scheduleHiRes() {
  clearTimeout(hiTimer);
  hiTimer = setTimeout(async () => {
    if (!curVp) return;
    const want = psFor(curVp, view.s);
    if (Math.abs(want - renderedPS) / want < 0.12) return;
    const my = renderToken, n = pageNum, cached = cache.get(n);
    if (view.s <= 1.02 && cached && cached.ps >= want * 0.99) { blit(cached.canvas, cached.ps); return; }
    const c = await renderToCanvas(n, want);
    if (my === renderToken && n === pageNum) blit(c, want);
  }, 160);
}

// ---------- ink ----------
function strokes() { if (!ink.has(pageNum)) ink.set(pageNum, []); return ink.get(pageNum); }
function ctxOf(c) { const x = c.getContext('2d'); x.setTransform(inkPS, 0, 0, inkPS, 0, 0); return x; }
function clearCanvas(c) { const x = c.getContext('2d'); x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, c.width, c.height); }
const penW = (st, pr) => st.w * (0.45 + 0.9 * pr);
function drawSeg(ctx, st, a, b) {
  ctx.lineWidth = penW(st, (a[2] + b[2]) / 2); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
}
function drawStroke(ctx, st) {
  const p = st.pts; if (!p.length) return;
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = st.color; ctx.fillStyle = st.color;
  if (st.tool === 'highlighter') {
    ctx.globalAlpha = 0.38; ctx.lineWidth = st.w; ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]);
    if (p.length === 1) ctx.lineTo(p[0][0] + 0.01, p[0][1]);
    for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]);
    ctx.stroke();
  } else if (p.length === 1) {
    ctx.beginPath(); ctx.arc(p[0][0], p[0][1], penW(st, p[0][2]) / 2, 0, Math.PI * 2); ctx.fill();
  } else for (let i = 1; i < p.length; i++) drawSeg(ctx, st, p[i - 1], p[i]);
  ctx.restore();
}
function redrawInk() { clearCanvas(inkc); const ctx = ctxOf(inkc); for (const st of (ink.get(pageNum) || [])) drawStroke(ctx, st); }
function snap() { const h = hist.get(pageNum) || []; h.push(strokes().slice()); if (h.length > 150) h.shift(); hist.set(pageNum, h); }
function undo() {
  const h = hist.get(pageNum);
  if (!h || !h.length) { toast('Nothing to undo on this slide'); return; }
  ink.set(pageNum, h.pop()); redrawInk(); markThumbs();
}
function clearSlide() {
  if (!strokes().length) { toast('This slide has no ink'); return; }
  snap(); ink.set(pageNum, []); redrawInk(); markThumbs(); toast('Slide cleared. Undo brings it back.');
}
let erasedSnap = false;
function eraseAt(x, y) {
  const a = strokes(), r = 10;
  const keep = a.filter(st => !st.pts.some(q => Math.hypot(q[0] - x, q[1] - y) < r + st.w / 2));
  if (keep.length !== a.length) { if (!erasedSnap) { snap(); erasedSnap = true; } ink.set(pageNum, keep); redrawInk(); markThumbs(); }
}

// ---------- laser ----------
let laser = [], laserRAF = 0;
function laserLoop() {
  const now = performance.now(), life = 650;
  laser = laser.filter(p => now - p.t < life);
  clearCanvas(livec); const ctx = ctxOf(livec);
  ctx.save(); ctx.lineCap = 'round'; ctx.shadowColor = 'rgba(255,40,40,.9)'; ctx.shadowBlur = 10 * inkPS;
  for (let i = 1; i < laser.length; i++) {
    const a = laser[i - 1], b = laser[i]; if (a.id !== b.id) continue;
    const k = 1 - (now - b.t) / life;
    ctx.strokeStyle = `rgba(255,59,48,${k})`; ctx.lineWidth = 2 + 5 * k;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  const last = laser[laser.length - 1];
  if (last && now - last.t < 120) { ctx.fillStyle = '#ff3b30'; ctx.beginPath(); ctx.arc(last.x, last.y, 5, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
  laserRAF = laser.length ? requestAnimationFrame(laserLoop) : 0;
  if (!laserRAF) clearCanvas(livec);
}

// ---------- pointer input ----------
const touches = new Map();
let g = null, penId = null, penLastUp = 0, cur = null, lastTap = { t: 0, x: 0, y: 0 };
const pressure = e => e.pointerType === 'pen' ? (e.pressure || 0.5) : 0.5;
function toPage(e, r) { return [(e.clientX - r.left) / r.width * curVp.width, (e.clientY - r.top) / r.height * curVp.height]; }

let wake = null;
async function keepAwake() { try { if (!wake && navigator.wakeLock) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => wake = null); } } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

stage.addEventListener('pointerdown', e => {
  keepAwake();
  if (e.pointerType === 'touch') return touchDown(e);
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  if (sheet.classList.contains('open')) { closeSheet(); return; }
  if (!pdfDoc || !curVp) return;
  penId = e.pointerId; try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  touches.clear(); g = null; // palm rejection: the pencil wins
  const r = pageEl.getBoundingClientRect(), [x, y] = toPage(e, r);

// Right third: next. Left third: previous. Top quarter of the middle third: toolbar. Rest of the middle: nothing.

function go(d) {

['gesturestart', 'gesturechange', 'gestureend', 'dblclick'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));

['touchstart', 'touchmove'].forEach(ev => stage.addEventListener(ev, e => { if (e.cancelable) e.preventDefault(); }, { passive: false }));

// ---------- toolbar ----------
function toggleBar(force) { bar.classList.toggle('hidden', force === undefined ? !bar.classList.contains('hidden') : !force); }

  buildSwatches();
}
function buildSwatches() {

  if (!list) return;
  for (const c of list) {
    const b = document.createElement('button');
    b.className = 'sw'; b.style.background = c; b.setAttribute('aria-label', COLOR_NAMES[c] || c); b.title = COLOR_NAMES[c] || c; b.setAttribute('aria-pressed', String(colors[tool] === c));
    b.onclick = () => { colors[tool] = c; buildSwatches(); };

document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
$('#bOpen').onclick = () => fileIn.click();
$('#bPrev').onclick = () => go(-1);
$('#bNext').onclick = () => go(1);
$('#bGrid').onclick = () => sheet.classList.contains('open') ? closeSheet() : openSheet();
$('#bUndo').onclick = undo;
$('#bClear').onclick = clearSlide;
$('#bHide').onclick = () => { toggleBar(false); toast('Tap the top centre of the slide to show the toolbar', 2200); };
$('#bFs').onclick = toggleFs;
$('#bSave').onclick = savePdf;

function toggleFs() {
  const d = document, el = d.documentElement;
  const on = d.fullscreenElement || d.webkitFullscreenElement;
  const fail = () => toast('Full screen isn’t available here. On iPad, use Share › Add to Home Screen for a full-screen app.', 4200);
  try {
    if (on) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) return fail();
    const r = req.call(el); if (r && r.catch) r.catch(fail);
  } catch (e) { fail(); }
}

// ---------- overview sheet ----------
let io = null;
const thumbQueue = []; let thumbBusy = false;

  io = new IntersectionObserver(ents => ents.forEach(en => { if (en.isIntersecting) { queueThumb(+en.target.dataset.n); io.unobserve(en.target); } }), { root: strip, rootMargin: '0px 600px' });

    const b = document.createElement('button');

    const n = thumbQueue.shift();
    try {
      const vp = await getVp(n), ps = (112 * dpr()) / vp.height, c = await renderToCanvas(n, ps);

let sheetY = null;
sheet.addEventListener('pointerdown', e => { sheetY = e.clientY; });

// ---------- loading ----------
async function loadBytes(bytes, name) {
  try {
    toast('Opening ' + name + '…', 1500);

    if (pdfDoc) pdfDoc.destroy();

    buildStrip(); await showPage(1);

fileIn.onchange = async () => {
  const f = fileIn.files[0]; if (!f) return;
  await loadBytes(new Uint8Array(await f.arrayBuffer()), f.name); fileIn.value = '';
};
const dz = $('#dropzone');
window.addEventListener('dragover', e => { e.preventDefault(); dz.hidden = false; });
window.addEventListener('dragleave', e => { if (!e.relatedTarget) dz.hidden = true; });
window.addEventListener('drop', async e => {
  e.preventDefault(); dz.hidden = true;
  const f = [...(e.dataTransfer?.files || [])].find(f => /pdf$/i.test(f.type) || /\.pdf$/i.test(f.name));
  if (f) await loadBytes(new Uint8Array(await f.arrayBuffer()), f.name);
});

let rT = 0;
window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { cache.clear(); if (pdfDoc) showPage(pageNum); }, 150); });

  if (e.target.closest && e.target.closest('input')) return;
  const k = e.key;

  else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); go(-1); }
  else if (k === 'Home') showPage(1);
  else if (k === 'End') showPage(numPages);
  else if (k === 'f') toggleFs();
  else if (k === 't') toggleBar();
  else if (k === 'g') sheet.classList.contains('open') ? closeSheet() : openSheet();
  else if (k === 'Escape') { closeSheet(); $('#savePanel').hidden = true; }

// ---------- saving ----------
let readyFile = null, readyUrl = null, dlCap = null;

    const { PDFDocument, LineCapStyle } = PDFLib;

}
$('#bShare').onclick = async () => {
  if (!readyFile) return;
  try {
    if (navigator.canShare && navigator.canShare({ files: [readyFile] })) { await navigator.share({ files: [readyFile], title: readyFile.name }); $('#savePanel').hidden = true; return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  $('#bDl').click();
};
$('#bDl').onclick = () => {
  if (!readyUrl) return;
  const a = document.createElement('a'); a.href = readyUrl; a.download = readyFile.name; document.body.appendChild(a); a.click(); a.remove();
};
$('#bSaveClose').onclick = () => $('#savePanel').hidden = true;

// ---------- sample deck: sample.pdf next to index.html (replace that file to change it) ----------
async function sampleDeck() {
  const r = await fetch('sample.pdf', { cache: 'no-cache' });
  if (!r.ok) throw new Error('sample.pdf not found');
  return new Uint8Array(await r.arrayBuffer());
}

setTool('pen');
sampleDeck().then(b => loadBytes(new Uint8Array(b), 'sample.pdf')).catch(e => { console.error(e); toast('Open a PDF to begin'); });
})();
