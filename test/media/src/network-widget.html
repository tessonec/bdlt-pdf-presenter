<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PageRank network (test widget)</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; font-family: "Source Sans 3", "Source Sans Pro", -apple-system, system-ui, sans-serif; color: #111; }
  #wrap { position: absolute; inset: 0; display: flex; flex-direction: column; }
  canvas { flex: 1; width: 100%; touch-action: none; display: block; }
  .bar { display: flex; align-items: center; gap: 14px; padding: 8px 14px; font-size: 18px; border-top: 1px solid #e3e6ef; }
  input[type=range] { flex: 1; accent-color: #0028A5; height: 28px; }
  output { font-variant-numeric: tabular-nums; min-width: 3.2em; font-weight: 600; }
  button { font: inherit; padding: 4px 14px; border-radius: 8px; border: 1px solid #c7cfe8; background: #f3f5fb; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="bar">
    <label for="d">Damping</label><input id="d" type="range" min="0.05" max="0.95" step="0.05" value="0.85"><output id="o">0.85</output>
    <button id="shake">Shake</button>
  </div>
</div>
<script>
// Test widget for media spec v1: works with or without the presenter's helper.
const bdlt = window.bdlt || (() => {
  let st = null, fns = []; let s = 7;
  return { version: '1', role: 'single', params: {}, seed: 7, state: null,
    random: () => (s = (s * 16807) % 2147483647) / 2147483647,
    setState(o) { st = o; this.state = o; fns.forEach(f => f(o)); },
    onState(f) { fns.push(f); }, onShow() {}, onHide() {}, now: () => performance.now(), asset: async n => n };
})();

const N = 14, cv = document.getElementById('c'), ctx = cv.getContext('2d');
const slider = document.getElementById('d'), out = document.getElementById('o');
// Graph: seeded random directed edges, identical in both copies
const edges = [];
for (let i = 0; i < N; i++) for (let k = 0; k < 2; k++) { let j = Math.floor(bdlt.random() * N); if (j === i) j = (j + 1) % N; edges.push([i, j]); }
const nodes = Array.from({ length: N }, () => ({ x: bdlt.random(), y: bdlt.random(), vx: 0, vy: 0 }));
let damping = 0.85, pr = pagerank(damping), drag = -1, running = true;

function pagerank(d) {
  let p = new Array(N).fill(1 / N); const out = new Array(N).fill(0); edges.forEach(([a]) => out[a]++);
  for (let it = 0; it < 60; it++) {
    const q = new Array(N).fill((1 - d) / N);
    edges.forEach(([a, b]) => q[b] += d * p[a] / out[a]); p = q;
  }
  return p;
}
function size() { const r = devicePixelRatio || 1; cv.width = cv.clientWidth * r; cv.height = cv.clientHeight * r; ctx.setTransform(r, 0, 0, r, 0, 0); }
addEventListener('resize', size); size();

function step() {
  const W = cv.clientWidth, H = cv.clientHeight, k = 0.0009;
  for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
    const a = nodes[i], b = nodes[j]; let dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy + 1e-4;
    const f = k / d2; a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f;
  }
  edges.forEach(([i, j]) => { const a = nodes[i], b = nodes[j], dx = b.x - a.x, dy = b.y - a.y, f = 0.02 * (Math.hypot(dx, dy) - 0.22); a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f; });
  nodes.forEach((n, i) => { n.vx += (0.5 - n.x) * 0.004; n.vy += (0.5 - n.y) * 0.004; if (i !== drag) { n.x += n.vx; n.y += n.vy; } n.vx *= 0.82; n.vy *= 0.82;
    n.x = Math.min(0.96, Math.max(0.04, n.x)); n.y = Math.min(0.94, Math.max(0.06, n.y)); });
  draw(W, H);
}
function draw(W, H) {
  ctx.clearRect(0, 0, W, H);
  const max = Math.max(...pr);
  ctx.lineWidth = 2; ctx.strokeStyle = '#c7cfe8';
  edges.forEach(([i, j]) => { const a = nodes[i], b = nodes[j]; arrow(a.x * W, a.y * H, b.x * W, b.y * H, 10 + 26 * pr[j] / max); });
  nodes.forEach((n, i) => {
    const r = 10 + 26 * pr[i] / max;
    ctx.beginPath(); ctx.arc(n.x * W, n.y * H, r, 0, 7); ctx.fillStyle = i === drag ? '#FFC845' : '#0028A5'; ctx.fill();
    ctx.fillStyle = i === drag ? '#111' : '#fff'; ctx.font = '600 13px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText((pr[i] * 100).toFixed(0), n.x * W, n.y * H);
  });
}
function arrow(x1, y1, x2, y2, r) {
  const a = Math.atan2(y2 - y1, x2 - x1), ex = x2 - Math.cos(a) * (r + 3), ey = y2 - Math.sin(a) * (r + 3);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(ex - 9 * Math.cos(a - .4), ey - 9 * Math.sin(a - .4)); ctx.lineTo(ex - 9 * Math.cos(a + .4), ey - 9 * Math.sin(a + .4)); ctx.closePath(); ctx.fillStyle = '#c7cfe8'; ctx.fill();
}
(function loop() { if (running) step(); requestAnimationFrame(loop); })();

// State shared with the projector: damping and node positions
let lastSent = 0;
function publish(force) {
  const now = performance.now(); if (!force && now - lastSent < 120) return; lastSent = now;
  bdlt.setState({ damping, pos: nodes.map(n => [+n.x.toFixed(4), +n.y.toFixed(4)]), drag });
}
bdlt.onState(s => {
  if (!s) return;
  damping = s.damping; slider.value = damping; out.textContent = damping.toFixed(2); pr = pagerank(damping);
  if (bdlt.role === 'projector' && s.pos) { s.pos.forEach((p, i) => { nodes[i].x = p[0]; nodes[i].y = p[1]; nodes[i].vx = nodes[i].vy = 0; }); drag = s.drag; }
});
slider.oninput = () => { damping = +slider.value; publish(true); };
document.getElementById('shake').onclick = () => { nodes.forEach(n => { n.vx += (bdlt.random() - .5) * .08; n.vy += (bdlt.random() - .5) * .08; }); };
if (bdlt.role !== 'projector') setInterval(() => publish(false), 150);

cv.addEventListener('pointerdown', e => {
  const W = cv.clientWidth, H = cv.clientHeight, r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / W, y = (e.clientY - r.top) / H;
  let best = -1, bd = 0.004; nodes.forEach((n, i) => { const d = (n.x - x) ** 2 + (n.y - y) ** 2; if (d < bd) { bd = d; best = i; } });
  drag = best; if (drag >= 0) cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => { if (drag < 0) return; const r = cv.getBoundingClientRect(); nodes[drag].x = (e.clientX - r.left) / cv.clientWidth; nodes[drag].y = (e.clientY - r.top) / cv.clientHeight; });
cv.addEventListener('pointerup', () => { drag = -1; publish(true); });
bdlt.onHide(() => running = false); bdlt.onShow(() => running = true);
bdlt.setState(bdlt.state || { damping: +(bdlt.params.damping || 0.85), pos: nodes.map(n => [n.x, n.y]), drag: -1 });
</script>
</body>
</html>
